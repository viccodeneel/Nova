services:
  - type: web
    name: nova-backend
    runtime: node
    plan: free
    buildCommand: bun install --frozen-lockfile && bun run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: NOVA_AUTH_PASSWORD
        sync: false
      - key: NOVA_AUTH_SECRET
        generateValue: true
      - key: MT5_BRIDGE_SECRET
        generateValue: true
      - key: LIVEKIT_SUMMARY_TOKEN
        sync: false
      - key: LIVEKIT_VOICE_ENABLED
        value: "true"
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_AGENT_NAME
        sync: false
      - key: LIVEKIT_TOOL_TOKEN_SECRET
        generateValue: true
      - key: LIVEKIT_AGENT_BRIDGE_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://viccodeneel.github.io
